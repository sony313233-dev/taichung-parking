name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed page and live parking source
        run: |
          sleep 3
          curl -fsSL --retry 5 --retry-delay 2 'https://sony313233-dev.github.io/taichung-parking/' | grep -q '朝富停車場（tiger）'
          python - <<'PY'
          import json, urllib.request
          url='https://r.jina.ai/https://tdx.transportdata.tw/api/basic/v1/Parking/OffStreet/ParkingAvailability/City/Taichung?$format=JSON'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Origin':'https://sony313233-dev.github.io','Accept':'text/plain'})
          with urllib.request.urlopen(req,timeout=30) as r:
              text=r.read().decode('utf-8','replace')
              assert r.headers.get('Access-Control-Allow-Origin') in ('*','https://sony313233-dev.github.io')
          start=text.find('{"UpdateTime"')
          end=text.rfind('}')
          assert start >= 0 and end > start
          data=json.loads(text[start:end+1])
          wanted=['西屯區-交通局-惠新P','西屯區-交通局-惠安P','西屯區-交通局-朝富P']
          found={}
          for p in data['ParkingAvailabilities']:
              name=p.get('CarParkName',{}).get('Zh_tw')
              if name in wanted:
                  car=next((x for x in p.get('Availabilities',[]) if int(x.get('SpaceType',-1))==1),None)
                  assert car is not None
                  found[name]=car['AvailableSpaces']
          assert set(found)==set(wanted), found
          print('Live parking OK:',found,'UpdateTime:',data.get('UpdateTime'))
          PY
