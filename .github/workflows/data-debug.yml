name: Inspect parking data
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check TDX CORS
        run: |
          curl -sS -D - -o /dev/null -H 'Origin: https://sony313233-dev.github.io' 'https://tdx.transportdata.tw/api/basic/v1/Parking/OffStreet/ParkingAvailability/City/Taichung?$format=JSON' | sed -n '1,40p'
