name: Inspect parking data
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch official Taichung parking API
        run: |
          python - <<'PY'
          import json, urllib.request
          url='https://motoretag.taichung.gov.tw/DataAPI/api/ParkingAPIV2/Opendata'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req, timeout=30) as r:
              raw=r.read()
          print('bytes',len(raw))
          text=raw.decode('utf-8-sig','replace')
          print('prefix',text[:500])
          data=json.loads(text)
          print('top type',type(data).__name__)
          def walk(x,path='root'):
              if isinstance(x,dict):
                  s=' '.join(str(v) for v in x.values() if isinstance(v,(str,int,float,bool)) or v is None)
                  if any(k in s for k in ['惠新','惠安','朝富']):
                      print('MATCH',path,json.dumps(x,ensure_ascii=False)[:4000])
                  for k,v in x.items(): walk(v,path+'.'+str(k))
              elif isinstance(x,list):
                  for i,v in enumerate(x): walk(v,f'{path}[{i}]')
          walk(data)
          PY
