name: Inspect parking data
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check browser-safe proxy options
        run: |
          python - <<'PY'
          import urllib.parse, urllib.request, urllib.error
          target='https://tdx.transportdata.tw/api/basic/v1/Parking/OffStreet/ParkingAvailability/City/Taichung?$format=JSON'
          urls=[
            ('allorigins','https://api.allorigins.win/raw?url='+urllib.parse.quote(target,safe='')),
            ('corsproxy','https://corsproxy.io/?url='+urllib.parse.quote(target,safe='')),
            ('jina-https','https://r.jina.ai/https://tdx.transportdata.tw/api/basic/v1/Parking/OffStreet/ParkingAvailability/City/Taichung?$format=JSON'),
            ('jina-http','https://r.jina.ai/http://tdx.transportdata.tw/api/basic/v1/Parking/OffStreet/ParkingAvailability/City/Taichung?$format=JSON'),
          ]
          for name,url in urls:
            print('\n###',name,url)
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Origin':'https://sony313233-dev.github.io','Accept':'*/*'})
            try:
              with urllib.request.urlopen(req,timeout=30) as r:
                body=r.read(800)
                print('status',r.status,'type',r.headers.get('content-type'),'acao',r.headers.get('access-control-allow-origin'))
                print(body[:600].decode('utf-8','replace'))
            except Exception as e:
              print('ERROR',repr(e))
              if isinstance(e,urllib.error.HTTPError):
                print(e.read(800).decode('utf-8','replace'))
          PY
