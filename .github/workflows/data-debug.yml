name: Inspect parking data
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect selected TDX lots
        run: |
          python - <<'PY'
          import json, urllib.request
          url='https://tdx.transportdata.tw/api/basic/v1/Parking/OffStreet/ParkingAvailability/City/Taichung?$format=JSON'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=30) as r:
              data=json.load(r)
          wanted={'西屯區-交通局-惠新P','西屯區-交通局-惠安P','西屯區-交通局-朝富P'}
          print('UpdateTime',data.get('UpdateTime'))
          for p in data['ParkingAvailabilities']:
              if p.get('CarParkName',{}).get('Zh_tw') in wanted:
                  print(json.dumps(p,ensure_ascii=False))
          PY
