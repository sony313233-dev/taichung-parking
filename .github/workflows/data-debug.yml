name: Inspect parking data
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch TDX availability without token
        run: |
          python - <<'PY'
          import urllib.request, urllib.error
          url='https://tdx.transportdata.tw/api/basic/v1/Parking/OffStreet/ParkingAvailability/City/Taichung?$format=JSON'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'})
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  raw=r.read()
                  print('status',r.status,'bytes',len(raw),'type',r.headers.get('content-type'))
                  print(raw[:1500].decode('utf-8','replace'))
          except urllib.error.HTTPError as e:
              print('HTTP',e.code)
              print(e.read()[:2000].decode('utf-8','replace'))
              raise
          PY
