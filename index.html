<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f4f6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="七期停車">
<link rel="manifest" href="manifest.webmanifest">
<title>七期停車</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans TC",sans-serif;color:#111;background:#f4f4f6}
*{box-sizing:border-box}
body{margin:0;background:#f4f4f6}
.wrap{max-width:520px;margin:0 auto;padding:64px 20px 40px}
h1{font-size:38px;line-height:1.1;margin:0 0 30px 4px;font-weight:800;letter-spacing:-1px}
.card{background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 7px 24px rgba(0,0,0,.05)}
.row{min-height:98px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 26px;border-bottom:1px solid #e7e7ea}
.row:last-child{border-bottom:0}
.name{font-size:22px;font-weight:700}
.count{font-size:25px;font-weight:800;white-space:nowrap}
.count.loading{font-size:17px;color:#888;font-weight:600}
.meta{min-height:56px;padding:20px 6px 9px;color:#777;font-size:15px;line-height:1.4}
.error{color:#b42318}
.btn{width:100%;border:0;border-radius:18px;background:#111;color:#fff;font-size:19px;font-weight:700;padding:19px 16px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn:disabled{opacity:.55}
.note{margin:13px 6px 0;color:#999;font-size:12px;line-height:1.45}
@media(max-width:390px){.wrap{padding-left:14px;padding-right:14px}.row{padding:0 18px}.name{font-size:19px}.count{font-size:22px}}
</style>
</head>
<body>
<main class="wrap">
  <h1>七期停車</h1>
  <section class="card">
    <div class="row"><div class="name">惠新停車場</div><div class="count loading" id="huixin">讀取中…</div></div>
    <div class="row"><div class="name">惠安停車場</div><div class="count loading" id="huian">讀取中…</div></div>
    <div class="row"><div class="name">朝富停車場（tiger）</div><div class="count loading" id="chaofu">讀取中…</div></div>
  </section>

  <div class="meta" id="meta">正在更新資料…</div>
  <button class="btn" id="refresh" type="button">重新整理 / 更新資料</button>
  <div class="note">顯示汽車剩餘車位；資料來自交通部 TDX，可能與現場有短暫落差。</div>
</main>

<script>
const LOTS = [
  { id: 'huixin', name: '西屯區-交通局-惠新P' },
  { id: 'huian', name: '西屯區-交通局-惠安P' },
  { id: 'chaofu', name: '西屯區-交通局-朝富P' }
];

const TDX = 'https://tdx.transportdata.tw/api/basic/v1/Parking/OffStreet/ParkingAvailability/City/Taichung?$format=JSON';
const READER = 'https://r.jina.ai/' + TDX;
const $ = id => document.getElementById(id);

function extractJson(text){
  let start = text.indexOf('{"UpdateTime"');
  if(start < 0) start = text.indexOf('{');
  const end = text.lastIndexOf('}');
  if(start < 0 || end <= start) throw new Error('資料格式錯誤');
  return JSON.parse(text.slice(start,end+1));
}

function carSpaces(p){
  const car = (p.Availabilities || []).find(x => Number(x.SpaceType) === 1);
  const value = car ? car.AvailableSpaces : p.AvailableSpaces;
  const n = Number(value);
  if(!Number.isFinite(n)) throw new Error('找不到汽車剩餘車位');
  return n;
}

async function getLiveData(){
  const response = await fetch(READER, {
    method:'GET',
    cache:'no-store',
    headers:{'Accept':'text/plain'}
  });
  if(!response.ok) throw new Error('資料連線失敗 ' + response.status);
  const text = await response.text();
  const data = extractJson(text);
  if(!Array.isArray(data.ParkingAvailabilities)) throw new Error('找不到停車資料');

  const values = {};
  for(const lot of LOTS){
    const p = data.ParkingAvailabilities.find(x => x?.CarParkName?.Zh_tw === lot.name);
    if(!p) throw new Error('找不到 ' + lot.name);
    values[lot.id] = carSpaces(p);
  }
  return { values, updateTime:data.UpdateTime || null };
}

function saveCache(result){
  try{ localStorage.setItem('parking-cache',JSON.stringify({savedAt:Date.now(),...result})); }catch(_){}
}
function readCache(){
  try{ return JSON.parse(localStorage.getItem('parking-cache')); }catch(_){ return null; }
}
function showValues(values){
  for(const lot of LOTS){
    const el=$(lot.id);
    el.classList.remove('loading');
    el.textContent = values[lot.id] + ' 格';
  }
}
function setLoading(){
  for(const lot of LOTS){
    const el=$(lot.id);
    el.classList.add('loading');
    el.textContent='讀取中…';
  }
}
function formatSourceTime(iso){
  if(!iso) return new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});
  const d=new Date(iso);
  if(Number.isNaN(d.getTime())) return iso;
  return d.toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});
}

async function update(){
  const btn=$('refresh');
  btn.disabled=true;
  btn.textContent='更新中…';
  $('meta').className='meta';
  $('meta').textContent='正在更新資料…';
  setLoading();

  try{
    const result=await getLiveData();
    showValues(result.values);
    saveCache(result);
    $('meta').textContent='資料時間：' + formatSourceTime(result.updateTime);
  }catch(err){
    const cached=readCache();
    if(cached?.values){
      showValues(cached.values);
      $('meta').className='meta error';
      $('meta').textContent='即時更新失敗，顯示上次資料';
    }else{
      for(const lot of LOTS){
        const el=$(lot.id);
        el.classList.remove('loading');
        el.textContent='—';
      }
      $('meta').className='meta error';
      $('meta').textContent='更新失敗，請再按一次更新';
    }
  }finally{
    btn.disabled=false;
    btn.textContent='重新整理 / 更新資料';
  }
}

$('refresh').addEventListener('click',update);
update();
</script>
</body>
</html>
